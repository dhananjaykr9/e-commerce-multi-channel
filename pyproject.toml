[project]
name = "e-commerce-multi-channel"
version = "0.1.0"
description = "E-Commerce Multi-Channel Revenue & Inventory Intelligence System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34.0",
    "pymysql>=1.1.0",
    "requests>=2.31.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.1",
    "snowflake-connector-python>=3.7.0",
    "pyspark>=3.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
]
